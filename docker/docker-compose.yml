services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "DabblerPlatform_2026!"
    ports:
      - "14333:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P 'DabblerPlatform_2026!'
          -Q 'SELECT 1' -C -l 5
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "18025:8025"
      - "11025:1025"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5011:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Services__ApiBaseUrl: http://api:8080
    ports:
      - "5010:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  playwright:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Playwright
    environment:
      PLAYWRIGHT_BASE_URL: http://web:8080
    depends_on:
      web:
        condition: service_healthy
