# Application services (api + web).
# Requires docker-compose.infra.yml to be up first (for the sqlserver + mailhog
# hostnames and the external `dabbler-dev` network).
#
# Build + run:   docker compose -f docker-compose.app.yml up --build
# Rebuild one:   docker compose -f docker-compose.app.yml build web
# Tear down:     docker compose -f docker-compose.app.yml down
#
# NOTE: explicit `image:` tags below mean rebuilds REPLACE the tagged image
# instead of orphaning it as a dangling <none>. This is the key fix for the
# "Docker Desktop filled up with 40GB of images" problem.
#
# NOTE: `playwright` is intentionally NOT a service here. Run Playwright tests
# from the host (dotnet test / VS Code Test Explorer) against http://localhost:5010.
# Containerizing the test runner is what caused the image churn originally.

name: dabbler-app

services:
  devidp:
    image: acmecoffee-devidp:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.DevIdp
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5100:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - dabbler-dev

  api:
    image: acmecoffee-api:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AcmeCoffeeOnline_Dev;User Id=sa;Password=DabblerPlatform_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "5011:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - dabbler-dev

  web:
    image: acmecoffee-web:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.Web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Services__ApiBaseUrl: http://api:8080
      # Container-internal self URL so server-side Blazor can POST to its own
      # endpoints without trying to resolve the browser-visible host port.
      # See Login.razor:PostSelfAsync — the browser's Host header is preserved.
      Services__WebSelfBaseUrl: http://localhost:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AcmeCoffeeOnline_Dev;User Id=sa;Password=DabblerPlatform_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Authentication__SeededSession__AllowNonLoopback: "true"
    ports:
      - "5010:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - dabbler-dev

networks:
  # Created by docker-compose.infra.yml. `external: true` means this file won't
  # create it — it expects it to already exist, which enforces infra-first startup.
  dabbler-dev:
    name: dabbler-dev
    external: true
