# dabbler.yaml -- what this repository declares about itself.
#
# Tracked, unlike local-overrides.yaml, because CI reads these facts and so
# does the next machine to pick up a session. Precedence is the packaged
# router-config.yaml, then this file, then local-overrides.yaml. Providers,
# models, roles and transports are deliberately absent.
schema_version: 1

# One suite: the unit, bUnit and in-process API/Web tests, through a solution
# filter that leaves out the two projects that need infrastructure:
#   - tests/AcmeCoffeeOnline.Playwright  needs the Docker stack (no skip guard)
#   - tests/Dabbler.Packaging.Smoke       needs packed nupkgs and SQL LocalDB
# Both stay manual gates; see AGENTS.md "Building and testing". Tests in
# PublicSurface / Templates / CrudSlice that need nupkgs skip themselves when
# pack-output/ is absent and DABBLER_PACK_OUTPUT is unset.
testing:
  suites:
    - name: unit
      # -m:1 runs the test projects one at a time: Templates.Tests and
      # CrudSlice.Tests both `dotnet new install` into the same template cache
      # and fail intermittently when they overlap.
      command: dotnet test Dabbler.Unit.slnf -m:1 --blame-hang-timeout 5m
      expensive: true
      covers:
        - "src"
        - "templates"
        - "tools"
        - "tests"
      test_roots:
        - "tests"
      test_glob: "*Tests.cs"
      test_name: "{name}Tests.cs"
      select: dotnet test Dabbler.Unit.slnf -m:1 --blame-hang-timeout 5m --filter {names}
      select_separator: "|"

# Step (f), packaging. Deliberately NOT declared yet: the managed instructions
# say a packaging block is added only by the release session that publishes,
# and a declared release that does not publish refuses to close. When that
# session comes (bump DabblerVersion, publish Dabbler.CrudSlice.Tool), it adds:
#
#   packaging:
#     pack:
#       argv: ["pwsh", "-NoProfile", "-File", "tools/pack.ps1", "-OutputDir", "{output}", "-CleanOutput"]
#
# with no push block: nuget.org publishing stays with .github/workflows/build.yml
# on an annotated `nuget-v<version>` tag via trusted publishing, so no
# credential lives on a developer machine.
